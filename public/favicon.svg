<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Praxis für Frauenheilkunde">
  <!-- Dasselbe Motiv wie die Wortmarke und wie das Master-Asset: die Kante, an der
       der warmweisse Kalkputz auf die salbeigrün gestrichene Fläche trifft.
       Kein Logo — es gibt noch keins, und ein erfundenes wäre das erste, was
       getauscht werden müsste. -->
  <rect width="32" height="32" fill="#fbf9f5" />
  <rect x="19" y="5" width="8" height="22" fill="#9db29c" />
  <rect x="5" y="5" width="11" height="22" fill="#f1ece3" />
</svg>
