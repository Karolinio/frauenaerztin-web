# Baut die Seite und liefert sie über GitHub Pages aus.
#
# Erzeugt von `node engine/ausrollen.mjs`. Von Hand geändert werden darf er —
# dann bitte den Grund dazuschreiben, sonst überschreibt ihn der nächste Lauf
# wortlos.
#
# Warum ein Bauschritt und nicht einfach der Ordner: `dist/` steht im .gitignore
# und gehört da auch hin — ein eingecheckter Bau ist eine zweite Wahrheit neben
# dem Quellcode und driftet beim ersten vergessenen Lauf.
name: Seite ausrollen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # npm und nicht pnpm — von Hand geaendert am 23.08.2026, Grund im Kopf
      # dieser Datei verlangt.
      #
      # Der Ablauf lief `pnpm install --frozen-lockfile` gegen eine
      # pnpm-lock.yaml vom 05.08.2026. Seitdem hat sich die package.json
      # geaendert (Skript `freigabe`, die fontsource-Pakete fuer `npm run
      # fonts`). `--frozen-lockfile` bricht dann ab, statt aufzuloesen — und
      # zwar zu Recht: ein Lockfile, das nicht zur package.json passt, ist
      # keine reproduzierbare Grundlage.
      #
      # Gearbeitet wird an diesem Projekt mit npm; package-lock.json ist die
      # gepflegte Datei. Der Ablauf folgt jetzt dem, was tatsaechlich benutzt
      # wird, statt umgekehrt.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Der Basispfad. Unter github.io liegt die Seite in einem Unterordner,
          # der so heisst wie das Repo — steht hier etwas anderes, sucht der
          # Browser JS und CSS an einer Stelle, an der nichts liegt.
          VITE_BASIS: /frauenaerztin-web/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  ausliefern:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
